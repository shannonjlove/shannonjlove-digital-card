<!doctype html>

<head>

<style>
  /* Print at true size: one card per page, 3.5 × 2 in, no margins. */
  @page{ size:3.5in 2in; margin:0; }

  :root{
    --ink:        #0b2b2a;
    --teal:       #104241;
    --teal-2:     #285453;
    --sand:       #FFD7B4;
    --cream:      #f3ece1;
    --dim:        #c9cdc6;
    --serif: Georgia, "Times New Roman", "Iowan Old Style", serif;
    --sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    font-family:var(--sans);
    color:var(--cream);
    background:var(--ink);
    -webkit-font-smoothing:antialiased;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .cards{
    display:flex; flex-wrap:wrap; justify-content:center; gap:40px;
    padding:40px 18px;
  }
  .biz{
    width:336px; height:192px; flex:0 0 auto;
    border-radius:10px; overflow:hidden;
    box-shadow:0 30px 70px -30px rgba(0,0,0,0.6);
  }

  a{ color:var(--cream); text-decoration:none; }
  a:hover{ color:var(--sand); text-decoration:underline; }
  a:focus-visible{ outline:2px solid var(--sand); outline-offset:2px; border-radius:3px; }

  /* ---------- Front ---------- */
  .front{
    padding:20px 22px;
    display:flex; flex-direction:column; justify-content:space-between;
    background:radial-gradient(120% 110% at 15% -10%, #285453 0%, #104241 45%, #0b2b2a 100%);
  }
  .front header{ display:flex; align-items:center; gap:14px; }
  .mono{
    width:44px; height:44px; flex:0 0 auto;
    border-radius:50%;
    border:1px solid rgba(255,215,180,0.35);
    display:grid; place-items:center;
    font-family:var(--serif); font-size:18px; letter-spacing:0.02em;
    color:var(--sand);
  }
  .id{ display:flex; flex-direction:column; gap:3px; }
  .front h1{
    margin:0;
    font-family:var(--serif); font-weight:400;
    font-size:23px; line-height:1.05; letter-spacing:-0.01em;
    color:var(--cream);
  }
  .role{ margin:0; font-size:12px; line-height:1.3; color:var(--dim); }
  .role b{ color:var(--cream); font-weight:600; }
  .rule{ height:1px; background:rgba(255,215,180,0.22); }

  .contact{
    margin:0; padding:0; list-style:none;
    display:flex; flex-direction:column; gap:5px;
    font-size:12px; line-height:16px;
  }
  .contact li{ display:flex; align-items:center; gap:9px; }
  .contact svg{ width:13px; height:13px; flex:0 0 auto; }
  .contact a:hover{ color:#FFD7B4; }

  /* ---------- Back ---------- */
  .back{
    padding:20px 22px;
    display:flex; gap:20px; align-items:center;
    background:var(--ink);
  }
  .qr{ display:flex; flex-direction:column; align-items:center; gap:7px; flex:0 0 auto; }
  .qr a{
    display:block; padding:8px; border-radius:10px;
    background:var(--cream); line-height:0;
  }
  .qr a:hover{ text-decoration:none; }
  .qr svg{ width:104px; height:104px; display:block; }
  .qr p{ margin:0; font-size:12px; letter-spacing:0.04em; color:var(--sand); }

  .follow{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .follow h2{
    margin:0 0 2px;
    font-size:12px; font-weight:400;
    letter-spacing:0.22em; text-transform:uppercase;
    color:var(--sand);
  }
  .follow ul{
    margin:0; padding:0; list-style:none;
    display:flex; flex-direction:column; gap:3px;
    font-size:12px; line-height:16px;
  }

  /* ---------- Print: one card per page ---------- */
  @media print{
    body{ background:none; }
    .cards{ display:block; padding:0; gap:0; }
    .biz{ box-shadow:none; border-radius:0; page-break-after:always; break-after:page; }
    .biz:last-child{ page-break-after:auto; break-after:auto; }
    a:hover{ text-decoration:none; }
  }
</style>
</head>
